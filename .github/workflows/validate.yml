name: Validate contributions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static contribution validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test validator
        run: python3 -B -m unittest discover -s tools/validation -p "test_*.py"
      - name: Validate contribution packages
        run: python3 -B tools/validation/validate.py
